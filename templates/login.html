<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSIT CampusVision AI — Portal</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <img src="/static/images/psit-logo.svg" alt="PSIT Logo" class="logo">
        <h1>CAMPUSVISION AI</h1>
        <div class="subtitle">Smart Campus Monitoring</div>
        <div class="college-tag">Pranveer Singh Institute of Technology (PSIT)</div>
      </div>

      <!-- Navigation Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register ID</button>
        <button class="auth-tab" id="tabReset" onclick="switchAuthTab('reset')">Reset Password</button>
      </div>

      {% if error %}
      <div class="error-banner">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      {% if success %}
      <div class="success-banner">
        ✅ {{ success }}
      </div>
      {% endif %}

      <!-- 1. LOGIN FORM -->
      <form id="formLogin" action="/login" method="post" class="login-form">
        <div class="form-group">
          <label for="login_college_id">College ID / Faculty ID</label>
          <input 
            type="text" 
            id="login_college_id" 
            name="college_id" 
            placeholder="e.g. PSIT001 or your custom ID" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="login_password">Password</label>
          <input 
            type="password" 
            id="login_password" 
            name="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="login-btn">
          SECURE SIGN IN
        </button>

        <div class="demo-credentials" style="margin-top: 20px;">
          <div><strong>Demo Admin:</strong> PSIT001 &bull; <em>pass: 12345</em></div>
          <div style="margin-top: 4px;"><strong>Demo Faculty:</strong> PSIT002 &bull; <em>pass: 12345</em></div>
        </div>
      </form>

      <!-- 2. REGISTRATION FORM (NEW USER) -->
      <form id="formRegister" action="/register" method="post" class="login-form" style="display: none;">
        <div class="form-group">
          <label for="reg_college_id">Create College ID</label>
          <input 
            type="text" 
            id="reg_college_id" 
            name="college_id" 
            placeholder="e.g. PSIT105 or ANANT01" 
            required
          >
        </div>

        <div class="form-group">
          <label for="reg_name">Full Name</label>
          <input 
            type="text" 
            id="reg_name" 
            name="name" 
            placeholder="e.g. Anant Sharma" 
            required
          >
        </div>

        <div class="form-group">
          <label for="reg_dept">Department</label>
          <input 
            type="text" 
            id="reg_dept" 
            name="dept" 
            placeholder="e.g. Computer Science / AI Lab" 
            required
          >
        </div>

        <div class="form-group">
          <label for="reg_role">Account Role</label>
          <select id="reg_role" name="role" class="auth-select" required>
            <option value="faculty">Faculty Member</option>
            <option value="admin">Campus Administrator</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg_password">Create Password</label>
          <input 
            type="password" 
            id="reg_password" 
            name="password" 
            placeholder="••••••••" 
            required
          >
        </div>

        <button type="submit" class="login-btn">
          REGISTER ACCOUNT
        </button>
      </form>

      <!-- 3. RESET PASSWORD FORM -->
      <form id="formReset" action="/reset-password" method="post" class="login-form" style="display: none;">
        <div class="form-group">
          <label for="reset_college_id">Your College ID</label>
          <input 
            type="text" 
            id="reset_college_id" 
            name="college_id" 
            placeholder="e.g. PSIT001" 
            required
          >
        </div>

        <div class="form-group">
          <label for="reset_new_password">Enter New Password</label>
          <input 
            type="password" 
            id="reset_new_password" 
            name="new_password" 
            placeholder="Enter new password" 
            required
          >
        </div>

        <button type="submit" class="login-btn" style="background: linear-gradient(135deg, #d97706, #f59e0b);">
          UPDATE PASSWORD
        </button>
      </form>

      <div style="margin-top: 20px; font-size: 11px; color: var(--text-dim);">
        SQLite Powered Database &bull; Tech Expo 2026 Edition
      </div>
    </div>
  </div>

  <script>
    function switchAuthTab(tab) {
      const formLogin = document.getElementById("formLogin");
      const formRegister = document.getElementById("formRegister");
      const formReset = document.getElementById("formReset");
      const tabLogin = document.getElementById("tabLogin");
      const tabRegister = document.getElementById("tabRegister");
      const tabReset = document.getElementById("tabReset");

      [tabLogin, tabRegister, tabReset].forEach(t => t.classList.remove("active"));
      formLogin.style.display = "none";
      formRegister.style.display = "none";
      formReset.style.display = "none";

      if (tab === "login") {
        formLogin.style.display = "block";
        tabLogin.classList.add("active");
      } else if (tab === "register") {
        formRegister.style.display = "block";
        tabRegister.classList.add("active");
      } else if (tab === "reset") {
        formReset.style.display = "block";
        tabReset.classList.add("active");
      }
    }
  </script>

</body>
</html>
